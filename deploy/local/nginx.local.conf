# Local reverse proxy: WordPress on /, exam portal on /exam.
# Mirrors deploy/nginx-aft-portal.conf but without TLS and using Docker DNS names.
server {
    listen 80;
    server_name localhost;

    client_max_body_size 60m;

    # Node's Express mount path has no trailing slash, so /exam/ is redirected.
    location = /exam {
        return 301 /exam/;
    }

  # Everything under /exam goes to the Node app. No trailing slash on proxy_pass
  # so the /exam prefix is preserved for Express to strip itself.
    location /exam/ {
        proxy_pass http://exam:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}