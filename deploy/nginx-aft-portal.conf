# Reverse proxy for the AFT learning portal.
# Copy to /etc/nginx/sites-available/aft-portal and symlink into sites-enabled.
# Replace <YOUR_DOMAIN> before use.
#
# The portal is served from a path prefix (http://<host>/exam) because the domain root is
# occupied by the main WordPress site. Everything the portal owns lives under that prefix:
#
#   /exam/            app shell (SPA)
#   /exam/assets/     built JS/CSS/images  (generated by the Vite `base` option)
#   /exam/api/trpc    tRPC
#   /exam/api/...     webhooks, PayFast ITN, auto-submit
#   /exam/storage/... signed-resource redirect proxy
#
# The `proxy_pass` directives below deliberately have NO trailing slash on the port. That makes
# nginx forward the request path unchanged, so Node receives `/exam/api/trpc` and can mount the
# app at the prefix itself. Adding a trailing slash would strip `/exam` and break every route.

server {
    listen 80;
    server_name <YOUR_DOMAIN>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name <YOUR_DOMAIN>;

    # certbot will replace these after `certbot --nginx`
    ssl_certificate     /etc/letsencrypt/live/<YOUR_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<YOUR_DOMAIN>/privkey.pem;

    # Large file uploads (admin resources / objective attachments)
    client_max_body_size 60m;

    # Without the trailing slash the app is served from its own directory, so relative asset
    # URLs resolve correctly and the SPA deep links (e.g. /exam/admin) are matched.
    location = /exam {
        return 301 /exam/;
    }

    # Cache built assets (hashed filenames) aggressively
    location /exam/assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else under the prefix (app shell, /api/trpc, /storage, webhooks, payfast ITN) -> Node
    location /exam/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
