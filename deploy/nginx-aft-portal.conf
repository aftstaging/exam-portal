# Reverse proxy for the AFT learning portal.
# Copy to /etc/nginx/sites-available/aft-portal and symlink into sites-enabled.
# Replace <YOUR_DOMAIN> before use. Treat "aft-portal" as a lone server_name for a fresh domain,
# or drop the server_name / use $host if you already have a TLS-terminating block.

# Plain HTTP -> redirect to HTTPS (used until certbot adds its own block)
server {
    listen 80;
    server_name <YOUR_DOMAIN>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name <YOUR_DOMAIN>;

    # certbot will replace these after `certbot --nginx`
    ssl_certificate     /etc/letsencrypt/live/<YOUR_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<YOUR_DOMAIN>/privkey.pem;

    # Large file uploads (admin resources / objective attachments)
    client_max_body_size 60m;

    # Cache static assets (hashed filenames) aggressively
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else (app shell, /api/trpc, /storage, webhooks, payfast ITN) -> Node
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}